<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mileo | Book a checkpoint</title>
  <link rel="stylesheet" href="../assets/mileo-new.css">
</head>

<body class="auth-pending" data-allow-roles="admin">

<header class="m-top">
  <a class="m-brand" href="../index.html"><span>M</span>Mileo</a>
  <nav aria-label="Admin">
    <a class="m-link" href="index.html">Admin</a>
    <a class="m-link" href="checkpoints.html" aria-current="page">Checkpoints</a>
    <span class="m-who" data-auth-name>Admin</span>
    <button class="m-btn quiet" type="button" data-auth-signout>Sign out</button>
  </nav>
</header>

<main class="m-main">
  <h1 class="cp-title">Book a checkpoint</h1>
  <p id="setupNote" class="m-note" hidden></p>

  <div id="readyList" class="ready-list" aria-label="Ready for a checkpoint"></div>

  <form id="bookForm">
    <div class="cp-tiles">
      <section class="cp-tile bg-pink" aria-label="Student">
        <div id="studentRing"></div>
        <strong id="studentName" class="t-name" style="font-size:1.7rem">Choose a student</strong>
        <label class="visually-hidden" for="pick">Student and module</label>
        <select id="pick" required></select>
      </section>

      <section class="cp-tile bg-blue" aria-label="Assessor">
        <div id="assessors" class="av-pick" role="radiogroup" aria-label="Assessor"></div>
        <strong id="assessorName" class="t-name" style="font-size:1.4rem">&nbsp;</strong>
      </section>

      <section class="cp-tile bg-yellow" aria-label="When">
        <svg width="80" height="80" viewBox="0 0 96 96" aria-hidden="true"><rect x="10" y="16" width="76" height="70" rx="16" fill="#fff"></rect><rect x="10" y="16" width="76" height="22" rx="11" fill="#F7A8CB"></rect><rect x="28" y="8" width="8" height="18" rx="4" fill="#1B1D4B"></rect><rect x="60" y="8" width="8" height="18" rx="4" fill="#1B1D4B"></rect></svg>
        <label class="visually-hidden" for="when">Date and time</label>
        <input id="when" type="datetime-local" required>
        <label class="visually-hidden" for="length">Length</label>
        <select id="length"><option value="15">15 min</option><option value="20" selected>20 min</option><option value="30">30 min</option></select>
        <label class="visually-hidden" for="link">Video call link (optional)</label>
        <input id="link" type="url" placeholder="Call link (optional)" pattern="https://.*" maxlength="500">
      </section>
    </div>

    <div class="cp-actions">
      <button id="bookBtn" class="m-btn big" type="submit">Book →</button>
    </div>
    <p id="status" class="m-status" role="status" aria-live="polite" style="text-align:center;margin-top:12px"></p>
  </form>

  <section class="booked" aria-labelledby="bookedTitle">
    <h2 id="bookedTitle" class="section-h" style="font-size:1.6rem">Booked</h2>
    <div id="booked"><p class="m-hint">Nothing booked yet.</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/auth-guard.js"></script>
<script src="../assets/checkpoint-ui.js"></script>
<script src="../assets/admin-checkpoints.js"></script>

</body>
</html>
